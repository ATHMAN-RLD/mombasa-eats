<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mombasa Eats{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ocean: #1B3A4B;
            --sand: #F5ECD9;
            --saffron: #E8A33D;
            --henna: #B84A3E;
            --charcoal: #2B2420;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background: var(--sand);
            color: var(--charcoal);
            line-height: 1.5;
        }
        h1, h2 {
            font-family: 'Fraunces', serif;
            font-weight: 700;
            margin-top: 0;
        }
        header {
            background: var(--ocean);
            padding: 1.25rem 2rem;
        }
        header a {
            color: var(--sand);
            text-decoration: none;
            font-family: 'Fraunces', serif;
            font-weight: 700;
            font-size: 1.3rem;
        }
        main {
            max-width: 640px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
        }
        .restaurant-card {
            background: #fff;
            border-bottom: 3px solid var(--saffron);
            border-radius: 4px;
            padding: 1.1rem 1.3rem;
            margin-bottom: 1rem;
        }
        .restaurant-card a {
            color: var(--ocean);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.15rem;
        }
        .price {
            color: var(--henna);
            font-weight: 600;
        }
        a { color: var(--ocean); }
        button, input[type="submit"] {
            background: var(--henna);
            color: #fff;
            border: none;
            padding: 0.65rem 1.3rem;
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        input[type="text"], input[type="tel"] {
            font-family: 'Inter', sans-serif;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            max-width: 300px;
        }
    </style>
</head>
<body>
    <header>
        <a href="/">Mombasa Eats</a>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    {% block extra_js %}{% endblock %}
</body>
</html>
